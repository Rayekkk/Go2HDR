name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Go2HDR.slnx
      - run: dotnet build Go2HDR.slnx --configuration Release --no-restore
      - run: dotnet test Go2HDR.Tests/Go2HDR.Tests.csproj --configuration Release --no-build
